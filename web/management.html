<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #11111b;
            color: #cdd6f4;
            padding: 16px;
            line-height: 1;
        }

        a {
            color: #f5c2e7;
        }

        p, h1 {
            margin: 16px 0;
        }

        footer {
            color: #a6adc8;
            font-size: 12px;
        }

        button {
            background-color: #1e1e2e;
            color: #f5c2e7;
            border: none;
            padding: 2px 4px;
            transition: 0.1s all;
        }

        button:hover {
            background-color: #f5c2e7;
            color: #1e1e2e;
        }

        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <h1>kittycat</h1>
    <form method="post" action="/m/upload" enctype="multipart/form-data">
        <input type="file" name="file">
        <button type="submit">Upload</button>
    </form>
    <ul>
        <li><a href="/Cargo.toml">Cargo.toml</a> <button onclick="copy('Cargo.toml')">Copy Link</button> <button>Delete</button></li>
    </ul>
    <footer>{VERSION_STRING}</footer>

    <script>
        function copy(text) {
            navigator.clipboard.writeText(text);
        }
    </script>
</body>
</html>
